apiVersion: v1
kind: Pod
metadata:
  name: dev-shell
spec:
  containers:
    - name: dev
      image: nvidia/cuda:13.0.1-devel-ubuntu24.04
      command: ["sleep", "infinity"]
      stdin: true
      tty: true

      # privileged grants the full capability set. The two profile overrides are
      # the part that actually matters here: the stock cri-containerd AppArmor
      # profile carries a blanket `deny mount,` that blocks mount(2) regardless
      # of capabilities, which is what defeated every in-container workaround.
      securityContext:
        privileged: true
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: Unconfined

      env:
        # Keep models in the same volume that survives a restart.
        - name: HF_HUB_CACHE
          value: /models/hub

      resources:
        limits:
          nvidia.com/gpu: 8
          # CPU and memory intentionally unrestricted.
          # Container may use available node resources.

      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: models
          mountPath: /models

  volumes:
    # Shadows containerd's default 64 MiB tmpfs. vLLM needs ~2.1 GiB at TP=8
    # (one 160 MiB broadcast queue + a 240 MiB response queue per worker);
    # tmpfs pages are charged only as they are used, so this is a ceiling.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 128Gi

    # Node-local so the ~893 GB checkpoint survives pod restarts. Swap for a
    # PVC if the pod may ever land on a different node.
    - name: models
      hostPath:
        path: /var/lib/inference-poc/models
        type: DirectoryOrCreate
